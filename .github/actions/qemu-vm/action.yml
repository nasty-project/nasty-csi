name: Boot QEMU VM with K3S
description: >
  Boot a QEMU virtual machine with Ubuntu Noble, install K3S, and prepare
  it for CSI driver E2E testing. Uses SLIRP user-mode networking with port
  forwarding for SSH and K3S API access.

inputs:
  vm_memory:
    description: VM memory in MB
    required: false
    default: "4096"
  vm_cpus:
    description: VM CPU cores
    required: false
    default: "4"
  nasty_host:
    description: NASty server hostname/IP for connectivity check
    required: true
  tailscale_authkey:
    description: Tailscale auth key for VPN connectivity (optional — if set, connects VM to tailnet)
    required: false
    default: ""

outputs:
  kubeconfig:
    description: Path to the kubeconfig for the K3S cluster in the VM
    value: /tmp/kubeconfig
  ssh-opts:
    description: SSH options for connecting to the VM
    value: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i /tmp/vm-key -p 2222"
  scp-opts:
    description: SCP options for copying files to/from the VM
    value: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i /tmp/vm-key -P 2222"

runs:
  using: composite
  steps:
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
          sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -la /dev/kvm

    - name: Install host dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          qemu-system-x86 \
          qemu-utils \
          genisoimage

    - name: Read prebuilt image configuration
      id: image-config
      shell: bash
      run: |
        source "$GITHUB_ACTION_PATH/image.env"
        RECIPE_HASH=$(sha256sum \
          "$GITHUB_ACTION_PATH/build-image.sh" \
          "$GITHUB_ACTION_PATH/image.env" | cut -d ' ' -f1 | sha256sum | cut -c1-16)
        echo "cache-prefix=nasty-csi-qemu-${IMAGE_REVISION}-${RECIPE_HASH}-" >> "$GITHUB_OUTPUT"
        echo "k3s-version=${K3S_VERSION}" >> "$GITHUB_OUTPUT"
        echo "ubuntu-release=${UBUNTU_IMAGE_RELEASE}" >> "$GITHUB_OUTPUT"
        echo "ubuntu-sha256=${UBUNTU_IMAGE_SHA256}" >> "$GITHUB_OUTPUT"

    - name: Restore prebuilt VM image
      id: prebuilt-cache
      continue-on-error: true
      uses: actions/cache/restore@v5
      with:
        path: /tmp/ubuntu-prebuilt.qcow2
        key: ${{ steps.image-config.outputs.cache-prefix }}${{ github.run_id }}-${{ github.job }}
        restore-keys: ${{ steps.image-config.outputs.cache-prefix }}

    - name: Validate prebuilt VM image
      id: prebuilt
      shell: bash
      run: |
        if [ -s /tmp/ubuntu-prebuilt.qcow2 ] && qemu-img check /tmp/ubuntu-prebuilt.qcow2; then
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Using cached prebuilt VM image"
        else
          rm -f /tmp/ubuntu-prebuilt.qcow2
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "Prebuilt VM image unavailable; using full provisioning fallback"
        fi

    - name: Cache Ubuntu cloud image
      if: steps.prebuilt.outputs.available != 'true'
      id: cache-image
      continue-on-error: true
      uses: actions/cache@v5
      with:
        path: /tmp/ubuntu-cloud.img
        key: ubuntu-noble-cloudimg-amd64-${{ steps.image-config.outputs.ubuntu-release }}

    - name: Download Ubuntu cloud image
      if: steps.prebuilt.outputs.available != 'true' && steps.cache-image.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fSL -o /tmp/ubuntu-cloud.img \
          https://cloud-images.ubuntu.com/noble/${{ steps.image-config.outputs.ubuntu-release }}/noble-server-cloudimg-amd64.img

    - name: Validate Ubuntu cloud image
      if: steps.prebuilt.outputs.available != 'true'
      shell: bash
      run: |
        if ! echo "${{ steps.image-config.outputs.ubuntu-sha256 }}  /tmp/ubuntu-cloud.img" | sha256sum --check; then
          curl -fSL -o /tmp/ubuntu-cloud.img \
            https://cloud-images.ubuntu.com/noble/${{ steps.image-config.outputs.ubuntu-release }}/noble-server-cloudimg-amd64.img
        fi
        echo "${{ steps.image-config.outputs.ubuntu-sha256 }}  /tmp/ubuntu-cloud.img" | sha256sum --check
        qemu-img check /tmp/ubuntu-cloud.img

    - name: Prepare VM disk
      shell: bash
      run: |
        if [ "${{ steps.prebuilt.outputs.available }}" = "true" ]; then
          cp /tmp/ubuntu-prebuilt.qcow2 /tmp/vm-disk.qcow2
        else
          cp /tmp/ubuntu-cloud.img /tmp/vm-disk.qcow2
        fi
        qemu-img resize /tmp/vm-disk.qcow2 20G

    - name: Create cloud-init ISO
      shell: bash
      run: |
        ssh-keygen -t ed25519 -f /tmp/vm-key -N "" -q
        bash "$GITHUB_ACTION_PATH/create-cloud-init.sh" \
          "${{ steps.prebuilt.outputs.available }}" \
          "${{ steps.image-config.outputs.k3s-version }}" \
          /tmp/vm-key.pub \
          /tmp/cloud-init

        genisoimage -output /tmp/cloud-init.iso \
          -volid cidata -joliet -rock \
          /tmp/cloud-init/user-data /tmp/cloud-init/meta-data

    - name: Boot QEMU VM
      shell: bash
      run: |
        qemu-system-x86_64 \
          -enable-kvm \
          -m ${{ inputs.vm_memory }} \
          -smp ${{ inputs.vm_cpus }} \
          -cpu host \
          -drive file=/tmp/vm-disk.qcow2,format=qcow2,if=virtio \
          -cdrom /tmp/cloud-init.iso \
          -nic user,model=virtio-net-pci,hostfwd=tcp::2222-:22,hostfwd=tcp::6443-:6443 \
          -display none \
          -serial file:/tmp/vm-console.log \
          -daemonize \
          -pidfile /tmp/vm.pid

        echo "VM started (PID: $(cat /tmp/vm.pid))"

    - name: Wait for SSH
      shell: bash
      run: |
        SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i /tmp/vm-key -p 2222"
        echo "Waiting for VM SSH..."
        for i in $(seq 1 60); do
          if ssh $SSH_OPTS ci@localhost true 2>/dev/null; then
            echo "SSH ready (attempt $i)"
            exit 0
          fi
          sleep 5
        done
        echo "::error::SSH did not become available"
        cat /tmp/vm-console.log || true
        exit 1

    - name: Wait for cloud-init and K3S
      shell: bash
      run: |
        SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i /tmp/vm-key -p 2222"

        echo "Waiting for cloud-init to finish..."
        if ! timeout 15m ssh $SSH_OPTS ci@localhost "sudo cloud-init status --wait"; then
          echo "::group::cloud-init output"
          ssh $SSH_OPTS ci@localhost "sudo tail -n 400 /var/log/cloud-init-output.log; sudo cloud-init status --long" || true
          echo "::endgroup::"
          echo "::group::VM console"
          tail -n 400 /tmp/vm-console.log || true
          echo "::endgroup::"
          echo "::error::cloud-init did not complete within 15 minutes"
          exit 1
        fi

        echo "Waiting for K3S to be ready..."
        ssh $SSH_OPTS ci@localhost "test -f /tmp/k3s-ready"
        echo "K3S is ready"

        echo "VM node status:"
        ssh $SSH_OPTS ci@localhost "sudo kubectl get nodes -o wide"

        echo ""
        echo "Loaded kernel modules:"
        ssh $SSH_OPTS ci@localhost "lsmod | grep -E 'nvme_tcp|iscsi_tcp|nfs|cifs' || echo 'WARNING: some modules not loaded'"

    - name: Connect host to Tailscale
      if: inputs.tailscale_authkey != ''
      shell: bash
      run: |
        echo "Installing Tailscale on host runner..."
        curl -fsSL https://tailscale.com/install.sh | sudo sh
        echo "Connecting host to Tailscale..."
        sudo tailscale up --auth-key='${{ inputs.tailscale_authkey }}' --accept-routes --hostname=ci-host-$(head -c4 /dev/urandom | xxd -p)
        echo "Host Tailscale IP: $(tailscale ip -4)"

    - name: Connect VM to Tailscale
      if: inputs.tailscale_authkey != ''
      shell: bash
      run: |
        SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i /tmp/vm-key -p 2222"
        echo "Installing Tailscale in VM..."
        ssh $SSH_OPTS ci@localhost "command -v tailscale >/dev/null || curl -fsSL https://tailscale.com/install.sh | sudo sh"
        ssh $SSH_OPTS ci@localhost "sudo systemctl enable --now tailscaled"
        echo "Connecting VM to Tailscale..."
        ssh $SSH_OPTS ci@localhost "sudo tailscale up --auth-key='${{ inputs.tailscale_authkey }}' --accept-routes --accept-dns --hostname=ci-vm-\$(head -c4 /dev/urandom | xxd -p)"
        echo "Waiting for Tailscale IP..."
        for i in $(seq 1 30); do
          TS_IP=$(ssh $SSH_OPTS ci@localhost "tailscale ip -4 2>/dev/null" || true)
          if [ -n "$TS_IP" ]; then
            echo "VM Tailscale connected: $TS_IP"
            break
          fi
          sleep 2
        done

    - name: Verify NASty reachable from VM
      shell: bash
      run: |
        SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i /tmp/vm-key -p 2222"
        NASTY_HOST="${{ inputs.nasty_host }}"
        echo "Checking connectivity to NASty ($NASTY_HOST) from VM..."

        echo "::group::Tailscale status (VM)"
        ssh $SSH_OPTS ci@localhost "tailscale status || true"
        echo "::endgroup::"

        echo "::group::DNS resolution for $NASTY_HOST"
        ssh $SSH_OPTS ci@localhost "getent hosts $NASTY_HOST || echo 'DNS lookup failed'"
        echo "::endgroup::"

        echo "::group::Tailscale ping to $NASTY_HOST"
        ssh $SSH_OPTS ci@localhost "tailscale ping --c 3 --timeout 5s $NASTY_HOST || true"
        echo "::endgroup::"

        echo "::group::HTTPS probe (curl -v)"
        ssh $SSH_OPTS ci@localhost "curl -vk --connect-timeout 10 --max-time 15 https://$NASTY_HOST -o /dev/null" \
          && echo 'NASty API is reachable from VM' \
          || { echo '::error::NASty is NOT reachable from VM'; echo "::endgroup::"; exit 1; }
        echo "::endgroup::"

    - name: Fetch kubeconfig from VM
      shell: bash
      run: |
        SCP_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i /tmp/vm-key -P 2222"
        scp $SCP_OPTS ci@localhost:/etc/rancher/k3s/k3s.yaml /tmp/kubeconfig
        echo "Kubeconfig fetched, testing kubectl from host..."
        KUBECONFIG=/tmp/kubeconfig kubectl get nodes

    - name: Install snapshot CRDs and controller
      shell: bash
      env:
        KUBECONFIG: /tmp/kubeconfig
      run: |
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/release-8.4/client/config/crd/snapshot.storage.k8s.io_volumesnapshotclasses.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/release-8.4/client/config/crd/snapshot.storage.k8s.io_volumesnapshotcontents.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/release-8.4/client/config/crd/snapshot.storage.k8s.io_volumesnapshots.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/release-8.4/deploy/kubernetes/snapshot-controller/rbac-snapshot-controller.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/release-8.4/deploy/kubernetes/snapshot-controller/setup-snapshot-controller.yaml
        kubectl wait --for=condition=available --timeout=60s deployment/snapshot-controller -n kube-system || true
