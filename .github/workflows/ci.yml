name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  GO_VERSION: 1.27.2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --config .golangci.yml

      - name: CI-ratchet regression tests
        run: python3 -m unittest discover -s tests/ci

      - name: Suppression budget (no growth against main)
        run: |
          git fetch origin main --depth=1
          python3 tests/ci/check_nolint_budget.py --baseline-ref origin/main

      - name: Reachable vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Read-only module tidiness check
        run: go mod tidy -diff

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: make test-unit

      - name: Current coverage
        run: go test -short -coverprofile="$RUNNER_TEMP/csi-current.cover" ./pkg/... ./cmd/...

      - name: Prepare main coverage baseline
        run: |
          git fetch origin main --depth=1
          git worktree add --detach "$RUNNER_TEMP/csi-coverage-base" origin/main

      - name: Main coverage (same Go version and platform)
        working-directory: ${{ runner.temp }}/csi-coverage-base
        run: |
          go mod edit -dropreplace github.com/nasty-project/nasty-go
          go mod download github.com/nasty-project/nasty-go
          go test -short -coverprofile="$RUNNER_TEMP/csi-baseline.cover" ./pkg/... ./cmd/...

      - name: Package coverage must not decrease
        run: python3 tests/ci/check_coverage.py "$RUNNER_TEMP/csi-current.cover" "$RUNNER_TEMP/csi-baseline.cover"
      - name: Workload image regressions (no live cluster)
        run: |
          go test -race ./tests/e2e/framework
          python3 -m unittest discover -s tests/ci

      - name: Sanity runner regressions
        run: bash tests/sanity/test-runner.sh

      - name: CSI sanity suite
        run: make test-sanity

      - name: Build
        run: make build

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-24.04
    needs: [lint, test]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version info
        id: version
        run: |
          VERSION="0.0.1"
          {
            echo "version=${VERSION}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nasty-csi:latest
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
